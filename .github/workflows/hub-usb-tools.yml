name: Package PicoBrew Hub
on:
  pull_request:
    paths:
      - 'server/**'
      - 'firmware/**'
      - 'tools/**'
      - '.github/workflows/hub-usb-tools.yml'
  push:
    branches: [master]
  workflow_dispatch:
concurrency:
  group: hub-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  revision:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
      pinned: ${{ steps.version.outputs.pinned }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: version
        env:
          PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'jeffreydwalter/picobrew' }}
        run: |
          tag=$(python3 server/tools/usb/release.py source-tag)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "pinned=$(python3 server/tools/usb/release.py current-pins)" >> "$GITHUB_OUTPUT"
          echo "release=$PUBLISH" >> "$GITHUB_OUTPUT"
  native:
    name: Hub / ${{ matrix.platform }}
    needs: revision
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: darwin-arm64, runner: macos-15}
          - {platform: darwin-amd64, runner: macos-15-intel}
          - {platform: windows-amd64, runner: windows-2025}
          - {platform: linux-amd64, runner: ubuntu-22.04}
          - {platform: linux-arm64, runner: ubuntu-22.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build and test candidate USB worker
        if: needs.revision.outputs.release != 'true' && needs.revision.outputs.pinned != 'true'
        run: |
          python -m pip install PyInstaller==6.22.3 -r firmware/common/requirements-usb.txt -r firmware/pico-s-pro/modified/requirements-usb.txt
          python -m unittest discover -s server/tools/usb -p "test_*.py"
          python server/tools/usb/build_worker.py --output artifacts
      - name: Stage the source-pinned worker
        if: needs.revision.outputs.release == 'true' || needs.revision.outputs.pinned == 'true'
        run: python server/tools/usb/release.py stage ${{ matrix.platform }} artifacts ${{ needs.revision.outputs.tag }}
      - name: Verify the embedded programmer and the Hub version
        env:
          PICOBREW_REQUIRE_USB_WORKER: "1"
          TAG: ${{ needs.revision.outputs.tag }}
        working-directory: server
        shell: bash
        run: |
          go run ./tools/usb-prepare -local ../artifacts
          go test ./internal/usbservice/helper -run TestEmbedded -count=1
          suffix=""
          if [ "${{ runner.os }}" = Windows ]; then suffix=.exe; fi
          worker="../artifacts/picobrew-usb-${{ matrix.platform }}${suffix}"
          chmod +x "$worker"
          test "$("$worker" --version | tr -d '\r')" = "1.0.0"
          binary="../artifacts/picobrew-hub-${{ matrix.platform }}${suffix}"
          go build -buildvcs=true -trimpath -o "$binary" ./cmd/picobrew-hub
          go version -m "$binary" | grep -F "vcs.revision=$GITHUB_SHA"
          test "$("$binary" --version | tr -d '\r')" = "${TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: usb-${{ matrix.platform }}
          path: artifacts/
          retention-days: 14

  pi32:
    name: Hub / linux-arm (Pi OS 32-bit)
    needs: revision
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with: {platforms: arm}
      - name: Package worker in 32-bit Debian Bookworm
        if: needs.revision.outputs.release != 'true' && needs.revision.outputs.pinned != 'true'
        run: |
          mkdir -p artifacts
          docker run --rm --platform linux/arm/v7 -v "$GITHUB_WORKSPACE:/src" -w /src debian:bookworm-slim bash server/tools/usb/build_pi32.sh
      - name: Stage the source-pinned worker
        if: needs.revision.outputs.release == 'true' || needs.revision.outputs.pinned == 'true'
        run: python3 server/tools/usb/release.py stage linux-arm artifacts ${{ needs.revision.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Verify the embedded programmer and 32-bit Hub
        working-directory: server
        env: {GOOS: linux, GOARCH: arm, GOARM: '7', CGO_ENABLED: '0', TAG: '${{ needs.revision.outputs.tag }}'}
        run: |
          install -m 755 ../artifacts/picobrew-usb-linux-arm "$RUNNER_TEMP/pi-worker"
          worker_version=$(docker run --rm --platform linux/arm/v7 -v "$RUNNER_TEMP/pi-worker:/worker:ro" debian:bookworm-slim /worker --version)
          test "$worker_version" = "1.0.0"
          go build -o /tmp/picobrew-stage ./tools/usb-prepare
          /tmp/picobrew-stage -local ../artifacts
          go test -c -o /tmp/picobrew-usb-test ./internal/usbservice/helper
          docker run --rm --platform linux/arm/v7 -e PICOBREW_REQUIRE_USB_WORKER=1 -v /tmp/picobrew-usb-test:/usb-test:ro debian:bookworm-slim /usb-test -test.run TestEmbedded -test.v
          go build -buildvcs=true -trimpath -o ../artifacts/picobrew-hub-linux-arm ./cmd/picobrew-hub
          go version -m ../artifacts/picobrew-hub-linux-arm | grep -F "vcs.revision=$GITHUB_SHA"
          test "$(../artifacts/picobrew-hub-linux-arm --version)" = "${TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: usb-linux-arm
          path: artifacts/
          retention-days: 14

  publish:
    if: needs.revision.outputs.release == 'true'
    needs: [revision, native, pi32]
    runs-on: ubuntu-latest
    timeout-minutes: 85
    permissions:
      contents: write
      actions: read
    outputs:
      container_ready: ${{ steps.release.outputs.container_ready }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.revision.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: usb-*
          merge-multiple: true
          path: artifacts
      - name: Assemble verified release files for the current master revision
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          state=$(python3 server/tools/usb/release.py check-ci "$GITHUB_SHA")
          if [ "$state" != ready ]; then exit 0; fi
          python3 server/tools/usb/release.py assemble "$TAG" artifacts "$GITHUB_SHA"
          (cd artifacts && sha256sum --check SHA256SUMS.txt)
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.assemble.outputs.ready == 'true'
        with:
          name: hub-release-${{ needs.revision.outputs.tag }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Publish an available source version
        id: release
        if: steps.assemble.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ref=$(git ls-remote origin "refs/tags/$TAG")
          if [ -n "$ref" ]; then
            git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
            tagged=$(git rev-parse "$TAG^{commit}")
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "$TAG already identifies $tagged. The verified build for $GITHUB_SHA is available in the workflow artifacts." >> "$GITHUB_STEP_SUMMARY"
              if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)" = "$GITHUB_SHA" ]; then
                echo "container_ready=true" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
          fi
          if gh release view "$TAG" --json isDraft,targetCommitish > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            test "$(jq -r .targetCommitish "$RUNNER_TEMP/release.json")" = "$GITHUB_SHA"
            test "$(jq -r .isDraft "$RUNNER_TEMP/release.json")" = false
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)" = "$GITHUB_SHA" ]; then
              echo "container_ready=true" >> "$GITHUB_OUTPUT"
              echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          draft="hub-build-$GITHUB_SHA"
          if gh release view "$draft" --json isDraft,targetCommitish > "$RUNNER_TEMP/draft.json" 2>/dev/null; then
            test "$(jq -r .targetCommitish "$RUNNER_TEMP/draft.json")" = "$GITHUB_SHA"
            test "$(jq -r .isDraft "$RUNNER_TEMP/draft.json")" = true
          else
            gh release create "$draft" --target "$GITHUB_SHA" --draft --title "PicoBrew Hub ${TAG#v}" --notes-file server/tools/usb/release-notes.md
          fi
          gh release upload "$draft" artifacts/* --clobber
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)" != "$GITHUB_SHA" ]; then
            gh release delete "$draft" --yes
            exit 0
          fi
          # Claim a previously unused tag without force before publishing the
          # draft. A concurrently published tag may never be moved by this job.
          if [ -z "$ref" ]; then git push origin "$GITHUB_SHA:refs/tags/$TAG"; fi
          gh release edit "$draft" --tag "$TAG" --draft=false --latest --target "$GITHUB_SHA"
          echo "container_ready=true" >> "$GITHUB_OUTPUT"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

  publish-container:
    name: Publish Hub container
    if: needs.revision.outputs.release == 'true' && needs.publish.outputs.container_ready == 'true'
    needs: [revision, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute container tags and labels
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.publish.outputs.release_tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/picobrew-hub"
          short_sha="${GITHUB_SHA:0:7}"
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "tags<<EOF"
            echo "${image}:latest"
            echo "${image}:sha-${short_sha}"
            if [ -n "$RELEASE_TAG" ]; then
              version="${RELEASE_TAG#v}"
              minor="${version%.*}"
              echo "${image}:${RELEASE_TAG}"
              echo "${image}:${version}"
              echo "${image}:${minor}"
            fi
            echo "EOF"
            echo "labels<<EOF"
            echo "org.opencontainers.image.source=https://github.com/${REPO}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.created=${created}"
            if [ -n "$RELEASE_TAG" ]; then
              echo "org.opencontainers.image.version=${RELEASE_TAG#v}"
            fi
            echo "org.opencontainers.image.title=PicoBrew Hub"
            echo "org.opencontainers.image.description=Local server and browser interface for PicoBrew machines"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push multi-arch container image
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
