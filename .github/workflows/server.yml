name: Verify PicoBrew Hub
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
defaults:
  run:
    working-directory: server
permissions:
  contents: read
concurrency:
  group: hub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Server and tools / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CGO_ENABLED: '0'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GNU Make on Windows
        if: runner.os == 'Windows'
        run: choco install make --yes --no-progress
      - name: Test and build backend
        shell: bash
        env:
          CATALOG_REQUIRE_FIRMWARE: '1'
          PICO_FIRMWARE_LIBRARY: ${{ github.workspace }}/firmware
        run: |
          go test ./...
          python -m unittest discover -s tools -p 'test_*.py'
          go vet ./...
          mkdir -p bin
          go build -trimpath -o bin/ ./cmd/picobrew-hub
      - name: Exercise Hub updates against native S/Pro recovery
        if: runner.os == 'Linux'
        env:
          PICO_HUB_RECOVERY_TEST: ${{ github.workspace }}/firmware/pico-s-pro/modified/tests/hub_recovery_host.py
        run: go test ./internal/device -run TestHubOTAWithNativeRecovery -count=1
      - name: Check backend races
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...
      - name: Check native build, terminal shutdown and saved data
        run: python tools/check_server_start.py
      - name: Check both make server-start entry points
        run: python tools/check_server_start.py --make
  frontend:
    name: Embedded website freshness / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node is a frontend development dependency, not a server prerequisite.
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: server/web/package-lock.json
      - name: Rebuild and compare the committed browser bundle
        shell: bash
        run: |
          npm --prefix web ci --engine-strict
          npm --prefix web run build
          npm --prefix web run check:bundle
          npm --prefix web run test:bundle
          npm --prefix web test
  browser:
    name: Web build and browser integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
          cache: true
      - uses: actions/setup-node@v4
        with:
          # Exercise the oldest supported release, including jsdom's patch floor.
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: server/web/package-lock.json
      - name: Build and test browser client
        run: |
          npm --prefix web ci --engine-strict
          npm --prefix web run build
          npm --prefix web run check:bundle
          npm --prefix web run test:integration
      - name: Install test browser
        working-directory: server/web
        run: npx playwright install --with-deps chromium
      - name: Browser integration with isolated Go simulator
        run: npm --prefix web run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-diagnostics
          path: |
            server/web/test-results
            server/web/playwright-report
          retention-days: 7
  container:
    name: Container build and startup / ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64, linux/arm/v7]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: matrix.platform != 'linux/amd64'
        with:
          platforms: arm64,arm
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker buildx build --platform ${{ matrix.platform }} --load -t picobrew-hub:test .
      - name: Check the embedded website and persistent volume
        run: |
          docker volume create hub-ci-data
          docker run -d --name hub-ci --platform ${{ matrix.platform }} --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --mount source=hub-ci-data,target=/data -p 127.0.0.1:18081:8080 -e HUB_PASSWORD=isolated-ci-password-not-for-production picobrew-hub:test
          trap 'docker rm -f hub-ci >/dev/null 2>&1; docker volume rm hub-ci-data >/dev/null 2>&1' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:18081/healthz; then break; fi
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:18081/healthz
          [[ "$(curl --fail --silent http://127.0.0.1:18081/)" == *'<title>PicoBrew Hub</title>'* ]]
          curl --fail --silent http://127.0.0.1:18081/third-party-licenses.md --output /dev/null
          docker restart hub-ci
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:18081/healthz; then break; fi
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:18081/healthz
