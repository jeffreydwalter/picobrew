name: Zymatic firmware
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zymatic:
    name: Zymatic 1.1.14 reconstruction and standalone AVR
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce the unprovisioned AVR extension
        working-directory: firmware/zymatic/modified
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/avr.tbz" https://downloads.arduino.cc/tools/avr-gcc-7.3.0-atmel3.6.1-arduino7-x86_64-pc-linux-gnu.tar.bz2
          echo "bd8c37f6952a2130ac9ee32c53f6a660feb79bee8353c8e289eb60fdcefed91e  $RUNNER_TEMP/avr.tbz" | sha256sum --check
          mkdir "$RUNNER_TEMP/avr"
          tar xf "$RUNNER_TEMP/avr.tbz" -C "$RUNNER_TEMP/avr" --strip-components=1
          npm ci --ignore-scripts --prefix tools
          node tools/build_site.cjs --check
          compact_source=$(PYTHONPATH=tools python -c 'from compact_build import SOURCE_REVISION; print(SOURCE_REVISION)')
          git fetch --depth=1 origin "$compact_source"
          python tools/compile_extension.py --profile compact --toolchain "$RUNNER_TEMP/avr/bin" --out-dir "$RUNNER_TEMP/compact"
          cmp extension/compact/extension.bin "$RUNNER_TEMP/compact/extension.bin"
          cmp extension/compact/extension.json "$RUNNER_TEMP/compact/extension.json"
          python tools/compile_extension.py --toolchain "$RUNNER_TEMP/avr/bin" --out-dir "$RUNNER_TEMP/extension"
          cmp extension/extension.bin "$RUNNER_TEMP/extension/extension.bin"
          cmp extension/crc-hole.bin "$RUNNER_TEMP/extension/crc-hole.bin"
          cmp extension/low.bin "$RUNNER_TEMP/extension/low.bin"
          cmp extension/extension.json "$RUNNER_TEMP/extension/extension.json"
      - name: Prepare the original and compose a temporary test application
        working-directory: firmware/zymatic/modified
        run: |
          python tools/usb_stock.py --data "$RUNNER_TEMP/factory"
          original="$RUNNER_TEMP/factory/usb-stock/zymatic/Zymatic_1_1_14.hex"
          echo "ZYMATIC_TEST_HEX=$original" >> "$GITHUB_ENV"
          current=$(PYTHONPATH=tools python -c 'from zymatic_build import VERSION; print(VERSION)')
          echo "ZYMATIC_TEST_VERSION=$current" >> "$GITHUB_ENV"
          for profile in compact extended; do
            python tools/package.py --profile "$profile" --data "$RUNNER_TEMP/composed-$profile" --oem-file "$original" --hub-host brewery.lan:8080
          done
      - name: Compare reconstructed controls and exercise the offline brew path
        working-directory: firmware/zymatic/reverse-engineered
        run: |
          python network/verify.py "$ZYMATIC_TEST_HEX"
          npm ci --prefix tests --ignore-scripts
          for profile in compact extended; do
            node tests/stock-controls.cjs "$ZYMATIC_TEST_HEX" "$RUNNER_TEMP"/composed-"$profile"/*/zymatic-"$ZYMATIC_TEST_VERSION".bin
          done
      - name: Test USB conversion, restoration, network service and simulated MCU
        working-directory: firmware/zymatic/modified
        run: |
          sudo apt-get update -qq
          # Ubuntu's simavr 1.6 uses a fixed 100 µs per SPI byte. The active
          # brew timing check needs the ATmega's configured clock divider.
          sudo apt-get install -y libelf-dev pkg-config
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/simavr.tgz" https://codeload.github.com/buserror/simavr/tar.gz/refs/tags/v1.8
          echo "51e2682d23fb4843191ee81dadcb5488fa6194553a108bbd6e60e8b1260269d6  $RUNNER_TEMP/simavr.tgz" | sha256sum --check
          tar xf "$RUNNER_TEMP/simavr.tgz" -C "$RUNNER_TEMP"
          prefix="$RUNNER_TEMP/simavr"
          make -j2 -C "$RUNNER_TEMP/simavr-1.8/simavr" install SIMAVR_VERSION=1.8 RELEASE=1 PREFIX="$prefix" DESTDIR="$prefix"
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
          export LD_LIBRARY_PATH="$prefix/lib"
          export ZYMATIC_TEST_AVR_BIN="$RUNNER_TEMP/avr/bin"
          python -m unittest discover -s tests
          python tests/run_simavr.py --oem-file "$ZYMATIC_TEST_HEX"
          make wifi-bench ARDUINO_AVR_BIN="$ZYMATIC_TEST_AVR_BIN"
