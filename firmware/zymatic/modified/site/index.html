<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<link rel="icon" href="/favicon.ico">
<title>PicoBrew Zymatic</title>
<style>
:root{color-scheme:light dark;font:1em system-ui}
body{max-width:36em;margin:auto;padding:1em}
canvas{width:min(100%,384px);image-rendering:pixelated}
pre{overflow:auto}
</style>
<h1>PicoBrew Zymatic</h1>
<p><output id="info"></output></p>
<button id="pair">Pair using dial</button>
<form id="form">
  <label>Device key <input id="key" type="password" required autocomplete="off"></label>
  <button>Show front panel</button>
</form>
<output id="message" aria-live="polite"></output>
<section id="owner" hidden>
  <canvas id="oled" width="128" height="64" aria-label="Brewer display"></canvas>
  <button id="up">Up</button> <button id="press">Press dial</button> <button id="down">Down</button>
  <p><button id="copy">Copy device key</button> <button id="forget">Forget key</button></p>
  <button id="journal">Brew history</button> <select hidden id="list" aria-label="Saved brew"></select>
  <pre id="samples"></pre>
</section>
<p>Rinse and clean the inline filter after every brew. Deep clean every 3–4 brews, then rinse.</p>
<!-- settings -->
<script src="/pair.js"></script>
